# The actions the workflows pin by major version, kept current. The library
# itself has no dependencies to keep.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
